# What has been worked out about the ebike bus, and how confident we are.
#
# This file is the record; dbc/ebike.dbc is generated from it by
# `uv run python -m bikecan.dbc`. Edit this, never the DBC.
#
# BIT NUMBERING -- read this before adding a signal.
#   big_endian:    start_bit counts MSB-first from byte 0, so bit 0 is the top
#                  bit of byte 0. This matches discover.bit_detail() and
#                  discover.candidate_fields().
#   little_endian: start_bit is the DBC position of the signal's LEAST
#                  significant bit, which for a byte-aligned value is
#                  8 * byte_index.
# The two conventions differ because DBC itself defines them differently.
# tests/test_dbc.py decodes a real payload of each kind to catch a mistake.
#
# confidence:
#   hypothesis  consistent with the recordings, not yet tested against a stimulus
#   probable    a stimulus experiment supports it, no ground truth measurement
#   confirmed   tied to a measured value or a commanded action
#
# GROUND TRUTH comes from the IoT serial console, which speaks the Queclink
# @Track protocol (see bikecan/queclink.py and reference/). Two things there
# are worth more than any amount of staring at payloads:
#   * +ACK:GTRTO logs each remote command by name (HLON, HLOFF, RLONEN, RLOFF,
#     UNLOCK, LOCK) with a timestamp on the same clock as the CAN log, so a
#     commanded action can be tied to the frame that carries it.
#   * +RESP:GTBMI relays BMS frames into the report VERBATIM -- the same bytes
#     appear in the CAN payload and in the report -- and +RESP:GTFRI carries
#     the pack voltage, so the BMS frames decode without guesswork.

# ---------------------------------------------------------------------------
# Confirmed by commanded action
# ---------------------------------------------------------------------------

